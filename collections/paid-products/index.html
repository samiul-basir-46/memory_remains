<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products & Templates - Petty Bloom</title>
  <link rel="icon" type="image/png" href="/assets/favicon-circle.png">
  <link rel="shortcut icon" type="image/png" href="/assets/favicon-circle.png">
  <link rel="apple-touch-icon" href="/assets/favicon-circle.png">
  <meta name="description" content="Browse our full collection of personalized magazines, wall frames, posters and stickers. Filter by category and collection.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="shop" class="font-body bg-bg text-text-dark antialiased">
  <div id="site-shell"></div>

  <main class="py-6 pb-20">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6">

      <div class="flex gap-8 items-start">

        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden lg:block w-[260px] flex-shrink-0 space-y-0">
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

            <!-- Featured -->
            <div class="p-4 border-b border-gray-50">
              <a href="/collections/paid-products" id="sidebar-featured-link" class="flex items-center gap-2.5 font-heading text-sm font-bold text-gray-800 hover:text-primary transition-colors no-underline py-1">
                <span class="w-7 h-7 rounded-lg bg-amber-50 flex items-center justify-center text-base">⭐</span>
                Featured Products
              </a>
            </div>

            <!-- Product Types -->
            <div class="p-4 border-b border-gray-50 product-type-section">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2.5">── Product Type ──</div>
              <div class="space-y-1">
                <button type="button" data-sidebar-type="all" id="sidebar-type-all" class="sidebar-type-btn w-full text-left px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2.5 cursor-pointer bg-pink-50 text-primary">
                  <span class="w-5 text-center">✨</span> All Products
                </button>
                <button type="button" data-sidebar-type="magazine" class="sidebar-type-btn w-full text-left px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2.5 cursor-pointer text-gray-700 hover:bg-gray-50 hover:text-primary">
                  <span class="w-5 text-center">📖</span> Magazines
                </button>
                <button type="button" data-sidebar-type="wall_frame" class="sidebar-type-btn w-full text-left px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2.5 cursor-pointer text-gray-700 hover:bg-gray-50 hover:text-primary">
                  <span class="w-5 text-center">🖼️</span> Wall Frames
                </button>
                <button type="button" data-sidebar-type="poster" class="sidebar-type-btn w-full text-left px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2.5 cursor-pointer text-gray-700 hover:bg-gray-50 hover:text-primary">
                  <span class="w-5 text-center">📜</span> Posters
                </button>
                <button type="button" data-sidebar-type="sticker" class="sidebar-type-btn w-full text-left px-3 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2.5 cursor-pointer text-gray-700 hover:bg-gray-50 hover:text-primary">
                  <span class="w-5 text-center">🏷️</span> Stickers
                </button>
              </div>
            </div>

            <!-- Categories -->
            <div id="sidebar-categories-group" class="p-4 border-b border-gray-50" hidden>
              <div id="sidebar-categories-heading" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2.5">── Categories ──</div>
              <div id="sidebar-categories-list" class="space-y-1 pt-0.5">
                <div class="skeleton-box w-full h-7 rounded-lg mb-1"></div>
                <div class="skeleton-box w-3/4 h-7 rounded-lg mb-1"></div>
                <div class="skeleton-box w-5/6 h-7 rounded-lg"></div>
              </div>
            </div>

            <!-- Collections -->
            <div id="sidebar-collections-group" class="p-4 border-b border-gray-50" hidden>
              <div id="sidebar-collections-heading" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2.5">── Collections ──</div>
              <div id="sidebar-collections-list" class="space-y-1 pt-0.5">
                <div class="skeleton-box w-full h-7 rounded-lg mb-1"></div>
                <div class="skeleton-box w-3/4 h-7 rounded-lg"></div>
              </div>
            </div>

            <!-- All Products button -->
            <div class="p-4">
              <button type="button" id="sidebar-all-products-btn" class="w-full text-left font-heading text-sm font-bold text-primary hover:underline flex items-center gap-2 py-1 cursor-pointer">
                <i class="fa-solid fa-border-all text-xs"></i> Show All Products
              </button>
            </div>
          </div>
        </aside>

        <!-- MAIN CONTENT -->
        <section class="flex-1 min-w-0 space-y-4">

          <!-- Mobile horizontal chips -->
          <div class="block lg:hidden overflow-x-auto scrollbar-none pb-1 -mx-1 px-1">
            <div id="mobile-sidebar-chips" class="flex items-center gap-2 min-w-max pb-2">
              <div class="skeleton-box w-24 h-8 rounded-full"></div>
              <div class="skeleton-box w-28 h-8 rounded-full"></div>
              <div class="skeleton-box w-20 h-8 rounded-full"></div>
            </div>
          </div>

          <!-- Collection Banner (hidden until collection selected) -->
          <div id="collection-detail-header" hidden class="relative h-[90px] md:h-[130px] rounded-2xl overflow-hidden shadow-md bg-gradient-to-r from-rose-700 to-pink-500 flex items-center px-6 text-white justify-between transition-all duration-300">
            <div id="collection-banner-bg" class="absolute inset-0 bg-cover bg-center opacity-30"></div>
            <div class="relative z-10 space-y-1">
              <h1 id="collection-title" class="font-heading text-xl md:text-2xl font-bold text-white leading-tight"></h1>
              <p id="collection-desc" class="text-xs md:text-sm text-pink-100 line-clamp-1 max-w-xl"></p>
            </div>
            <button type="button" id="collection-back-btn" class="relative z-10 px-4 py-2 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md text-white font-bold text-xs flex items-center gap-1.5 transition-all cursor-pointer whitespace-nowrap">
              <i class="fa-solid fa-xmark"></i> Clear filter
            </button>
          </div>

          <!-- Product Type Pills (top horizontal strip, all screen sizes) -->
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md py-3 border-b border-gray-100 -mx-4 px-4 sm:-mx-6 sm:px-6 lg:mx-0 lg:px-0 lg:border-none lg:bg-transparent lg:backdrop-blur-none lg:py-0 lg:static lg:z-auto">
            <div id="product-type-chips" class="flex items-center gap-2 overflow-x-auto scrollbar-none">
              <div class="skeleton-box w-28 h-9 rounded-full flex-shrink-0"></div>
              <div class="skeleton-box w-32 h-9 rounded-full flex-shrink-0"></div>
              <div class="skeleton-box w-28 h-9 rounded-full flex-shrink-0"></div>
              <div class="skeleton-box w-24 h-9 rounded-full flex-shrink-0"></div>
            </div>
          </div>

          <!-- Active filter bar -->
          <div id="active-filter-indicator-bar" class="flex flex-wrap items-center justify-between gap-3 text-xs bg-pink-50 px-4 py-2.5 rounded-xl border border-pink-100 opacity-0 hidden transition-opacity duration-300">
            <div class="flex items-center gap-2 flex-wrap text-gray-600">
              <span class="font-semibold text-gray-500">Filtered by:</span>
              <div id="active-filter-chips-list" class="flex items-center gap-2 flex-wrap"></div>
            </div>
            <div id="product-count-display" class="font-bold text-primary ml-auto"></div>
          </div>

          <!-- Sort & Filter bar -->
          <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
            <div class="flex items-center gap-3 flex-wrap">
              <button id="open-filter-btn" class="inline-flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-[#3b1c1c] font-semibold text-sm px-4 py-2 rounded-lg cursor-pointer transition-colors" type="button">
                Filter <i class="fa-solid fa-sliders text-xs"></i>
              </button>
              <div id="active-filters-container" class="flex items-center gap-2 flex-wrap"></div>
              <button id="clear-all-filters-btn" class="text-xs text-primary font-semibold hover:underline" type="button" hidden>Clear All</button>
            </div>
            <div class="relative">
              <button id="sort-dropdown-btn" class="inline-flex items-center gap-2 border border-gray-200 bg-white hover:border-primary text-text-dark text-sm px-4 py-2 rounded-lg cursor-pointer transition-colors" type="button">
                Sort: <strong id="sort-current-label" class="text-primary font-bold">Recommended</strong>
                <i class="fa-solid fa-arrows-up-down text-xs text-gray-400"></i>
              </button>
              <div id="sort-dropdown-menu" class="absolute right-0 top-full mt-2 w-52 bg-white border border-gray-100 shadow-xl rounded-xl py-2 z-30" hidden>
                <div class="sort-option cursor-pointer px-4 py-2 text-sm text-text-dark hover:bg-pink-50 hover:text-primary transition-colors" data-sort="recommended">Recommended</div>
                <div class="sort-option cursor-pointer px-4 py-2 text-sm text-text-dark hover:bg-pink-50 hover:text-primary transition-colors" data-sort="title-asc">Title: A → Z</div>
                <div class="sort-option cursor-pointer px-4 py-2 text-sm text-text-dark hover:bg-pink-50 hover:text-primary transition-colors" data-sort="title-desc">Title: Z → A</div>
                <div class="sort-option cursor-pointer px-4 py-2 text-sm text-text-dark hover:bg-pink-50 hover:text-primary transition-colors" data-sort="price-asc">Price: Low to High</div>
                <div class="sort-option cursor-pointer px-4 py-2 text-sm text-text-dark hover:bg-pink-50 hover:text-primary transition-colors" data-sort="price-desc">Price: High to Low</div>
              </div>
            </div>
          </div>

          <!-- Products Grid -->
          <div id="templates-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></div>

        </section>
      </div>
    </div>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
