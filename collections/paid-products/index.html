<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Paid Templates - Hearts and Beans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="shop">
  <div id="site-shell"></div>

  <main>
    <section class="section" style="padding-top: 2rem; padding-bottom: 4rem;">
      <div class="container">
        <div style="margin-bottom: 1.5rem;">
          <h1 style="font-family: 'Yeseva One', serif; font-size: clamp(2.2rem, 4.5vw, 3.2rem); color: #3b1c1c; margin: 0;">Paid Products</h1>
        </div>

        <!-- Filter & Sort Toolbar -->
        <div class="filter-sort-bar">
          <div class="filter-sort-left">
            <button id="open-filter-btn" class="filter-trigger-btn" type="button">
              <span>Filter</span>
              <i class="fa-solid fa-sliders"></i>
            </button>
            <div id="active-filters-container" class="active-filters-list"></div>
            <button id="clear-all-filters-btn" class="clear-filters-btn" type="button" hidden>Clear Filters</button>
          </div>

          <div class="filter-sort-right">
            <div class="sort-dropdown-container">
              <button id="sort-dropdown-btn" class="sort-trigger-btn" type="button">
                <span>Sort By : <strong id="sort-current-label">Recommended</strong></span>
                <i class="fa-solid fa-arrows-up-down" style="font-size: 0.8em; margin-left: 4px;"></i>
              </button>
              <div id="sort-dropdown-menu" class="sort-dropdown-menu" hidden>
                <div class="sort-option is-active" data-sort="recommended">Recommended</div>
                <div class="sort-option" data-sort="title-asc">Title: A &gt; Z</div>
                <div class="sort-option" data-sort="title-desc">Title: Z &gt; A</div>
                <div class="sort-option" data-sort="newest">New Arrivals</div>
                <div class="sort-option" data-sort="price-desc">Price: High to Low</div>
                <div class="sort-option" data-sort="price-asc">Price: Low to High</div>
                <div class="sort-option" data-sort="discount-desc">Discount: High to Low</div>
                <div class="sort-option" data-sort="discount-asc">Discount: Low to High</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Templates Grid v2 -->
        <div id="templates-grid" class="products-grid-v2"></div>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
