<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearts and Beans | Premium Memory Storefront</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="home">
  <div id="site-shell"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="page-intro" style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-family: var(--font-heading);">Magazine & Newspaper</h1>
        </div>
        
        <div class="shop-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <div class="shop-filters" style="display: flex; gap: 0.5rem;">
            <button class="pill-button pill-button--ghost" type="button" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-color: var(--color-primary); color: var(--color-primary);">Filter <i class="fa-solid fa-sliders" style="margin-left: 0.5rem;"></i></button>
            <button class="pill-button pill-button--ghost" type="button" style="padding: 0.4rem 1rem; font-size: 0.85rem; background-color: var(--color-bg-elevated); border: none; color: var(--color-primary);">In Stock <i class="fa-solid fa-xmark" style="margin-left: 0.5rem;"></i></button>
            <button type="button" style="background: none; border: none; color: var(--color-primary); font-size: 0.85rem; padding: 0.4rem 1rem; cursor: pointer;">Clear Filters</button>
          </div>
          <div class="shop-sort">
            <select id="sort-by" class="pill-button pill-button--ghost" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-color: var(--color-primary); color: var(--color-primary); appearance: none; background: transparent; cursor: pointer;">
              <option value="Recommended">Sort By : Recommended</option>
              <option value="Price: Low to High">Price: Low to High</option>
              <option value="Price: High to Low">Price: High to Low</option>
              <option value="Alphabetically: A-Z">Alphabetically: A-Z</option>
              <option value="Newest First">Newest First</option>
            </select>
          </div>
        </div>

        <div id="templates-grid" class="products-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
