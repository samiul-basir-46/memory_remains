<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Hearts and Beans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="profile" class="font-body bg-bg text-text-dark antialiased">
  <div id="site-shell"></div>

  <main>
    <section class="py-12">
      <div class="max-w-container mx-auto px-4">
        <div class="text-center max-w-2xl mx-auto mb-10">
          <span class="inline-block text-xs font-bold uppercase tracking-widest text-primary mb-2">Profile</span>
          <h1 class="font-heading text-3xl md:text-5xl text-[#3b1c1c] mb-3">Manage your account</h1>
          <p class="text-text-soft text-base">Keep your name and contact details up to date for smoother order verification and custom photo delivery.</p>
        </div>

        <div class="bg-white rounded-2xl border border-pink-100 p-8 shadow-sm max-w-xl mx-auto">
          <div id="profile-auth-required" class="auth-required text-center py-6">
            <i class="fa-solid fa-user-lock text-4xl text-primary mb-3"></i>
            <h2 class="font-heading text-2xl text-primary font-bold mb-2">Login Required</h2>
            <p class="text-text-soft text-sm mb-6">You must be logged in to view and edit your profile.</p>
            <button onclick="openAuthModal()" class="pill-button px-6 py-3 bg-primary hover:bg-primary-strong text-white font-bold rounded-xl text-sm transition-colors" type="button">Log In to Account</button>
          </div>

          <div id="profile-content-container">
            <div class="flex flex-col items-center gap-3 mb-6">
              <img id="profile-avatar" src="/assets/creator_profile.png" alt="Profile avatar" class="w-24 h-24 rounded-full object-cover border-2 border-primary/20 shadow-sm">
              <h3 id="profile-welcome-title" class="font-heading text-xl text-primary font-bold">Welcome!</h3>
            </div>

            <form id="profile-form" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                <input id="profile-name" type="text" placeholder="Full name" required class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm outline-none focus:border-primary">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
                <input id="profile-email" type="email" placeholder="Email address" disabled class="w-full px-4 py-3 border border-gray-200 bg-gray-50 text-gray-500 rounded-xl text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Phone Number</label>
                <input id="profile-phone" type="tel" placeholder="Phone number" class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm outline-none focus:border-primary">
              </div>
              <button type="submit" class="w-full py-3.5 bg-primary hover:bg-primary-strong text-white font-bold rounded-xl text-sm shadow-md transition-colors">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
