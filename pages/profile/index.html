<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Hearts and Beans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="profile">
  <div id="site-shell"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="page-intro">
          <span class="eyebrow">Profile</span>
          <h1>Manage your account and delivery details</h1>
          <p>Keep your name and contact details up to date for smoother order verification and custom photo delivery.</p>
        </div>

        <div class="card-panel" style="max-width:720px;margin:0 auto;padding:1.5rem">
          <div id="profile-auth-required" class="auth-required">
            <i class="fa-solid fa-user-lock"></i>
            <h2 style="color:var(--color-primary);margin-bottom:.75rem">Login Required</h2>
            <p style="color:var(--color-text-soft);margin-bottom:1rem">You must be logged in to view and edit your profile.</p>
            <button onclick="openAuthModal()" class="pill-button" type="button">Log In to Account</button>
          </div>

          <div id="profile-content-container">
            <div style="display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-bottom:1.5rem">
              <img id="profile-avatar" src="/assets/creator_profile.png" alt="Profile avatar" style="width:96px;height:96px;border-radius:999px;object-fit:cover;border:2px solid rgba(94,43,31,.16)">
              <h3 id="profile-welcome-title" style="color:var(--color-primary)">Welcome!</h3>
            </div>

            <form id="profile-form" class="stack-form">
              <input id="profile-name" type="text" placeholder="Full name" required>
              <input id="profile-email" type="email" placeholder="Email address" disabled>
              <input id="profile-phone" type="tel" placeholder="Phone number">
              <button type="submit" class="pill-button">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
