<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Hearts and Beans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="product-details">
  <div id="site-shell"></div>

  <main>
    <section class="section">
      <div class="container">
        <div id="details-loading-state" class="page-intro">
          <span class="eyebrow">Loading</span>
          <h1 style="font-size:clamp(2rem,4vw,3rem)">Loading template details...</h1>
          <p>Please wait while we fetch the latest product data from Firebase.</p>
        </div>

        <div id="details-content-container" hidden>
          <div class="details-grid">
            <div>
              <div id="gallery-main-container" class="gallery-main showcase-card" style="position:relative">
                <img id="details-main-image" src="/assets/instagram_stories_cozy.png" alt="Main product image">
                <span id="details-badge" class="product-badge"></span>
              </div>
              <div id="details-thumbnails-gallery" class="gallery-thumbs"></div>
            </div>

            <div class="detail-card">
              <span id="details-category" class="eyebrow"></span>
              <h1 id="details-title" style="font-size:clamp(2rem,4vw,3.2rem);color:var(--color-primary);margin-bottom:1rem"></h1>
              <p id="details-price" style="font-size:1.35rem;font-weight:700;color:var(--color-primary);margin-bottom:1rem"></p>
              <p id="details-description" style="color:var(--color-text-soft);margin-bottom:1.5rem"></p>

              <ul class="feature-list" style="color:var(--color-text);margin-top:0">
                <li>Fully customizable Canva templates</li>
                <li>Delivery through your library after approval</li>
                <li>Cloudinary-aware optimized gallery loading</li>
                <li>Responsive customer support</li>
              </ul>

              <button id="details-add-to-bag-btn" class="pill-button" type="button" style="width:100%">Add to Bag</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
