<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Templates - Hearts and Beans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="featured">
  <div id="site-shell"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="page-intro">
          <span class="eyebrow">Featured Products</span>
          <h1>Handpicked premium memory-led digital templates</h1>
          <p>Explore our best selling and most popular templates, handpicked for you.</p>
        </div>

        <div class="card-panel" style="padding:1.25rem;margin-bottom:1.5rem">
          <div class="section-heading" style="margin-bottom:0">
            <p id="product-count-label">0 products</p>
            <div class="inline-actions" style="margin-top:0">
              <label for="sort-by" class="eyebrow" style="margin-bottom:0">Sort by</label>
              <select id="sort-by" class="pill-button pill-button--ghost" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-color: var(--color-primary); color: var(--color-primary); cursor: pointer; background: transparent;">
                <option>Featured</option>
                <option>Price: Low to High</option>
                <option>Price: High to Low</option>
                <option>Alphabetically: A-Z</option>
              </select>
            </div>
          </div>
        </div>

        <div id="templates-grid" class="products-grid"></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container card-panel" style="padding:2rem">
        <div class="page-intro" style="margin-bottom:0">
          <span class="eyebrow">Newsletter</span>
          <h1 style="font-size:clamp(2rem,4vw,3rem)">Get free design assets and updates</h1>
          <p>Subscribe for product launches, custom order tips, and creator resources.</p>
        </div>
        <form class="newsletter-form stack-form" style="max-width:560px;margin:1.5rem auto 0">
          <input type="email" placeholder="Your email address" required aria-label="Email address">
          <button type="submit" class="pill-button">Subscribe</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-overlays"></div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
